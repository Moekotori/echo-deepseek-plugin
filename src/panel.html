<!doctype html>
<html lang="zh-CN" data-reduced-motion="true">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>DeepSeek</title><link rel="stylesheet" href="panel.css"><link rel="stylesheet" href="key-settings.css"><link rel="stylesheet" href="research.css"><link rel="stylesheet" href="composer.css"><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="recommendations.css"></head>
<body><div class="backdrop" aria-hidden="true"></div><main>
  <header class="page-heading"><div class="identity"><img src="assets/whale-chan.webp" width="52" height="52" alt=""><h1>DeepSeek</h1></div>
  <div class="key-controls"><div class="account-readout"><span id="status" role="status" aria-live="polite"></span><span id="balance" role="status" aria-live="polite"></span></div><details id="key-settings"><summary>API Key</summary><div id="settings">
    <div class="provider-choices" role="group" aria-label="模型协议"><span class="provider-thumb" aria-hidden="true"></span><button type="button" data-provider="deepseek" aria-pressed="true">DeepSeek · 推荐</button><button type="button" data-provider="openai" aria-pressed="false">OpenAI 兼容</button><button type="button" data-provider="anthropic" aria-pressed="false">Anthropic</button></div>
    <small class="provider-recommendation">推荐 DeepSeek，支持联网资料检索与余额显示。</small>
    <div id="model-fields" hidden><label for="model-base-url">API 地址</label><input id="model-base-url" type="url" maxlength="500" autocomplete="off" spellcheck="false"><label for="model-name">模型 ID</label><input id="model-name" maxlength="200" autocomplete="off" spellcheck="false" placeholder="填写服务提供的模型 ID"></div>
    <label for="api-key">DeepSeek API Key</label><input id="api-key" type="password" autocomplete="off" spellcheck="false" maxlength="512" placeholder="sk-…">
    <div class="actions"><button id="clear" type="button">清除</button><button id="save" type="button">保存</button></div>
  </div></details></div></header>
  <section id="research-tools" aria-label="音乐检索">
    <div class="research-subject"><svg class="search-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="m14 14 3.5 3.5"/></svg><input id="research-subject" maxlength="400" aria-label="检索对象" placeholder="艺人、歌曲或创作人员"><button id="use-current-track" type="button">使用当前歌曲</button></div>
    <small id="research-context"></small>
    <div class="tool-row">
      <div class="research-actions"><span class="research-pill" aria-hidden="true"></span><button type="button" data-research="news" aria-pressed="false">新作与演出</button><button type="button" data-research="track" aria-pressed="false">歌曲背景</button><button type="button" data-research="relations" aria-pressed="false">原唱与翻唱</button><button type="button" data-research="contributor" aria-pressed="false">创作人员作品</button><button type="button" data-research="explore" aria-pressed="false">探索相关作品</button><button type="button" id="stop-research" hidden>停止检索</button></div>
      <div class="personal-toolbar"><button id="show-daily" type="button">每日推荐</button><button id="stop-daily" type="button" hidden>停止推荐</button><details id="music-preferences"><summary>音乐偏好记忆</summary><div class="preferences-body"><label><input id="remember-music" type="checkbox" checked>记住明确表达的音乐偏好</label><label><input id="automatic-daily" type="checkbox">每天自动推荐</label><small>ECHO 运行时每天生成一次；开启后使用曲库概况、候选及已启用的偏好，同一天复用结果。</small><ul id="music-memories"></ul><button id="clear-memories" type="button">清空记忆</button></div></details></div>
    </div>
    <p id="research-status" role="status" aria-live="polite"></p><p id="personal-status" role="status" aria-live="polite"></p>
  </section>
  <section class="conversation" aria-label="DeepSeek 对话"><div class="character-welcome" aria-hidden="true"><img src="assets/whale-chan.webp" width="320" height="320" alt=""></div><section id="daily-results" aria-label="每日推荐" hidden></section><section id="research-results" aria-label="检索结果"></section><div id="transcript" role="log" aria-label="对话记录" aria-live="polite"></div></section>
  <div class="composer">
    <section id="playlist-preview" aria-label="歌单预览" hidden>
      <header><label for="playlist-name" class="sr-only">歌单预览</label><input id="playlist-name" maxlength="120" aria-label="歌单名称"><span id="playlist-count"></span></header>
      <ol id="playlist-tracks"></ol><p id="playlist-missing"></p>
      <button id="create-playlist" type="button">创建歌单</button>
    </section>
    <div id="chat-track-context" hidden><span id="chat-track-label"></span><button id="clear-chat-track" type="button" aria-label="清除歌曲上下文" title="清除歌曲上下文"><svg viewBox="0 0 10 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M2 2l6 6M8 2 2 8"/></svg></button></div>
    <textarea id="prompt" maxlength="2000" rows="1" aria-label="消息" placeholder="聊聊音乐，或描述你想创建的歌单…"></textarea>
    <div class="composer-footer"><div class="composer-library"><label class="share-option"><input id="share-library" type="checkbox"><span id="library-share-label">让 DeepSeek 从曲库选曲</span></label><small><span id="library-share-description">开启后向 DeepSeek 发送有界曲库概况及本次检索的曲名、艺术家、专辑、曲风、年份和时长。</span></small></div><div class="actions"><button id="clear-chat" type="button">清空对话</button><button id="stop-message" type="button" hidden>停止</button><button id="send-message" type="button" aria-label="发送"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg></button></div></div>
    <p id="chat-status" role="status" aria-live="polite"></p>
  </div>
</main><script src="__bridge__.js"></script><script src="panel.js"></script></body></html>
